<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="60" y1="60" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a3f47"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="ring-accent" x1="200" y1="40" x2="200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7ff"/>
      <stop offset="100%" stop-color="#2b6cff"/>
    </linearGradient>
  </defs>

  <!-- Внешнее шестиугольное кольцо -->
  <path d="M200 36 L322 106 L322 246 L200 316 L78 246 L78 106 Z"
        fill="none" stroke="url(#ring)" stroke-width="22" stroke-linejoin="round"/>

  <!-- Буква E внутри -->
  <g fill="url(#ring)">
    <rect x="150" y="120" width="36" height="160"/>
    <rect x="150" y="120" width="110" height="34"/>
    <rect x="150" y="183" width="86" height="32"/>
    <rect x="150" y="246" width="110" height="34"/>
  </g>

  <!-- Акцентный штрих по верхней грани кольца -->
  <path d="M200 36 L322 106" stroke="url(#ring-accent)" stroke-width="22" stroke-linecap="round"/>
</svg>
