<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Монохромный угольный цвет с лёгким объёмом, как в оригинале -->
    <linearGradient id="charcoal" x1="110" y1="70" x2="430" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3c3c3d"/>
      <stop offset="60%" stop-color="#2c2c2d"/>
      <stop offset="100%" stop-color="#1c1c1d"/>
    </linearGradient>
  </defs>

  <!-- Основной росчерк-галочка с раздвоенным острым кончиком -->
  <path d="M232 378
           L104 250
           L150 200
           L252 292
           L372 160
           L398 66
           L410 132
           L460 86
           L442 150
           Z"
        fill="url(#charcoal)"/>

  <!-- Пиксельный распад по левому нижнему краю -->
  <g fill="url(#charcoal)">
    <rect x="78"  y="252" width="22" height="22" opacity="0.9"/>
    <rect x="52"  y="286" width="17" height="17" opacity="0.7"/>
    <rect x="90"  y="300" width="14" height="14" opacity="0.6"/>
    <rect x="62"  y="330" width="12" height="12" opacity="0.45"/>
    <rect x="100" y="338" width="9"  height="9"  opacity="0.35"/>
    <rect x="38"  y="318" width="8"  height="8"  opacity="0.3"/>
  </g>
</svg>
