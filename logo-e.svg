<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Основной градиент: глубокий графит с холодным отливом -->
    <linearGradient id="grad-main" x1="80" y1="60" x2="320" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a3f47"/>
      <stop offset="55%" stop-color="#1f2329"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <!-- Акцентный градиент для динамичного росчерка -->
    <linearGradient id="grad-accent" x1="120" y1="120" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7ff"/>
      <stop offset="100%" stop-color="#2b6cff"/>
    </linearGradient>
    <!-- Лёгкая тень под фигурой -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Корпус буквы E: цельная угловатая форма -->
  <g filter="url(#soft-shadow)">
    <path d="M120 70
             L300 70
             L300 120
             L185 120
             L185 175
             L280 175
             L280 222
             L185 222
             L185 280
             L300 280
             L300 330
             L120 330
             Z"
          fill="url(#grad-main)"/>
  </g>

  <!-- Пиксельные фрагменты, отлетающие от вертикали (как в оригинале) -->
  <g fill="url(#grad-main)">
    <rect x="92"  y="92"  width="20" height="20" opacity="0.85"/>
    <rect x="70"  y="120" width="16" height="16" opacity="0.65"/>
    <rect x="96"  y="150" width="14" height="14" opacity="0.5"/>
    <rect x="78"  y="250" width="18" height="18" opacity="0.7"/>
    <rect x="98"  y="288" width="13" height="13" opacity="0.45"/>
  </g>

  <!-- Динамичный росчерк-акцент, рассекающий букву -->
  <path d="M150 250
           L330 95
           L300 150
           L205 235
           Z"
        fill="url(#grad-accent)" opacity="0.9"/>
  <path d="M150 250 L330 95"
        stroke="#cdefff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
