<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Глубокий угольный градиент для объёма -->
    <linearGradient id="charcoal" x1="120" y1="80" x2="430" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#434346"/>
      <stop offset="55%" stop-color="#2a2a2d"/>
      <stop offset="100%" stop-color="#151517"/>
    </linearGradient>
    <!-- Светлая грань-блик для эффекта сложенной плоскости -->
    <linearGradient id="sheen" x1="160" y1="120" x2="420" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6b6b70" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6b6b70" stop-opacity="0"/>
    </linearGradient>
    <!-- Мягкая тень под фигурой -->
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Основной росчерк: плавная галочка с острым взлетающим кончиком -->
  <path d="M460 68
           C 474 152, 398 296, 246 374
           L 116 248
           L 158 202
           C 252 300, 352 208, 434 114
           Z"
        fill="url(#charcoal)" filter="url(#drop)"/>

  <!-- Внутренняя грань-блик: придаёт объём и премиальность -->
  <path d="M158 202
           C 252 300, 352 208, 434 114
           L 410 150
           C 338 232, 250 300, 182 236
           Z"
        fill="url(#sheen)" opacity="0.5"/>

  <!-- Тонкая световая линия по верхнему ребру -->
  <path d="M158 206 C 252 300, 352 208, 432 116"
        stroke="#7a7a80" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- Распад в пиксели по левому краю: плавное затухание -->
  <g fill="url(#charcoal)">
    <rect x="82"  y="250" width="24" height="24" rx="3" opacity="0.92"/>
    <rect x="54"  y="284" width="18" height="18" rx="3" opacity="0.72"/>
    <rect x="92"  y="300" width="15" height="15" rx="2" opacity="0.6"/>
    <rect x="60"  y="328" width="13" height="13" rx="2" opacity="0.46"/>
    <rect x="100" y="340" width="10" height="10" rx="2" opacity="0.34"/>
    <rect x="34"  y="316" width="9"  height="9"  rx="2" opacity="0.28"/>
    <rect x="118" y="372" width="8"  height="8"  rx="2" opacity="0.2"/>
  </g>
</svg>
